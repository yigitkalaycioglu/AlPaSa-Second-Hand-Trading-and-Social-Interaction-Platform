<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="AlPaSa - Al, Pazarla, Sat. İkinci el eşyalarını listele, satışa çıkar, satıcılarla mesajlaş. React + TypeScript ile geliştirilmiş, verileri tarayicinda saklayan ikinci el pazar yeri."
    />
    <meta property="og:title" content="AlPaSa - İkinci El Pazar Yeri" />
    <meta
      property="og:description"
      content="Al, Pazarla, Sat. İkinci el eşyalar için modern pazar yeri."
    />
    <meta property="og:type" content="website" />
    <title>AlPaSa - Al, Pazarla, Sat</title>
    <script>
      // Tema flash'ini (FOUC) önlemek için React yuklenmeden önce uygulanır.
      (function () {
        try {
          var stored = localStorage.getItem('alpasa.theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* localStorage engelliyse varsayılan açık tema */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
